name: Build PSX and Linux versions

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request_target:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux port
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Clone main repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev
      - name: Configure
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-linux --parallel

  oracle-scene-suite:
    name: Capture and compare scene oracles
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'pull_request_target' && 'private-ci' || 'ci' }}
    steps:
      - name: Clone main repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Clone Mednafen oracle
        uses: actions/checkout@v7
        with:
          repository: sozud/mednafen-git
          ref: mmx4-oracle
          path: tools/mednafen
          persist-credentials: false
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake ninja-build pkg-config zlib1g-dev \
            libasound2-dev libjack-jackd2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libgl-dev libgles-dev libgl1-mesa-dri libglx-mesa0 xvfb
      - name: Resolve Mednafen revision
        id: mednafen_revision
        run: |
          echo "sha=$(git -C tools/mednafen rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore Mednafen oracle build
        id: mednafen_cache
        uses: actions/cache@v6
        with:
          path: tools/mednafen-build/src/mednafen
          key: mednafen-oracle-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mednafen_revision.outputs.image_os }}-${{ steps.mednafen_revision.outputs.sha }}
      - name: Get game dependencies
        uses: actions/checkout@v7
        with:
          repository: sozud/mmx4-deps
          ref: main
          token: ${{ secrets.MMX4_DEPS_TOKEN }}
          path: disks/dependencies
          persist-credentials: false
      - name: Extract game dependencies
        working-directory: disks
        run: cat dependencies/mmx4.us.tar.gz.part_* | tar -zxf -
      - name: Locate oracle inputs
        id: oracle_inputs
        run: |
          test -f disks/mmx4.us.cue
          oracle_bios=$(find disks -type f -iname 'SCPH1001.BIN' -print -quit)
          test -n "$oracle_bios"
          cp "$oracle_bios" tools/SCPH1001.BIN
          echo "disc_sha=$(sha256sum disks/mmx4.us.bin | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "bios_sha=$(sha256sum tools/SCPH1001.BIN | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Mednafen scene captures
        id: mednafen_scene_cache
        uses: actions/cache@v6
        with:
          path: mednafen-object-changes
          key: mednafen-scenes-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mednafen_revision.outputs.image_os }}-${{ steps.mednafen_revision.outputs.sha }}-${{ steps.oracle_inputs.outputs.disc_sha }}-${{ steps.oracle_inputs.outputs.bios_sha }}-${{ hashFiles('tools/oracle/run_mednafen_scene_suite.py', 'tools/oracle/scene_suite.py') }}
      - name: Restore Mednafen sound captures
        id: mednafen_sound_cache
        uses: actions/cache@v6
        with:
          path: |
            sound-comparison/**/psx.wav
            sound-comparison/**/psx.log
          key: mednafen-sound-v1-frames360-${{ runner.os }}-${{ runner.arch }}-${{ steps.mednafen_revision.outputs.image_os }}-${{ steps.mednafen_revision.outputs.sha }}-${{ steps.oracle_inputs.outputs.disc_sha }}-${{ steps.oracle_inputs.outputs.bios_sha }}-${{ hashFiles('tools/audio_fixture.py') }}
      - name: Configure Linux port
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DPSYZ_RENDERER=sdl3_gl
      - name: Build Linux port
        run: cmake --build build-linux --parallel
      - name: Configure Mednafen oracle
        if: steps.mednafen_cache.outputs.cache-hit != 'true'
        working-directory: tools
        run: |
          mkdir mednafen-build
          cd mednafen-build
          ../mednafen/configure \
            --enable-libxxx-mode \
            --disable-nls \
            --disable-cjk-fonts \
            --disable-fancy-scalers \
            --disable-apple2 \
            --disable-gb \
            --disable-gba \
            --disable-lynx \
            --disable-md \
            --disable-nes \
            --disable-ngp \
            --disable-pce \
            --disable-pce-fast \
            --disable-pcfx \
            --enable-psx \
            --disable-sasplay \
            --disable-sms \
            --disable-snes \
            --disable-snes-faust \
            --disable-ss \
            --disable-ssfplay \
            --disable-vb \
            --disable-wswan \
            --without-libflac
      - name: Build Mednafen oracle
        if: steps.mednafen_cache.outputs.cache-hit != 'true'
        run: make --directory tools/mednafen-build --jobs "$(nproc)"
      - name: Verify Mednafen oracle build
        run: test -x tools/mednafen-build/src/mednafen
      - name: Capture Mednafen scenes
        if: steps.mednafen_scene_cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/oracle/run_mednafen_scene_suite.py \
            --mednafen tools/mednafen-build/src/mednafen \
            --disc disks/mmx4.us.cue \
            --bios tools/SCPH1001.BIN \
            --output mednafen-object-changes
      - name: Capture Linux port scenes
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          python3 tools/oracle/run_pc_scene_suite.py \
            --binary build-linux/mmx4_pc \
            --output pc-object-changes
      - name: Compare scene captures
        run: |
          set -o pipefail
          mkdir -p scene-comparison
          python3 tools/oracle/compare_scene_suite.py \
            --mednafen mednafen-object-changes \
            --pc pc-object-changes \
            --output scene-comparison | tee scene-comparison/summary.txt
      - name: Compare sound captures
        run: |
          reuse_args=()
          if [[ '${{ steps.mednafen_sound_cache.outputs.cache-hit }}' == 'true' ]]; then
            reuse_args+=(--reuse-psx-audio)
          fi
          python3 tools/audio_fixture.py \
            --suite frontend \
            --pc build-linux/mmx4_pc \
            --mednafen tools/mednafen-build/src/mednafen \
            --disc disks/mmx4.us.cue \
            --bios tools/SCPH1001.BIN \
            --output sound-comparison \
            --no-build \
            "${reuse_args[@]}"
      - name: Upload oracle artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scene-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            mednafen-object-changes
            pc-object-changes
            scene-comparison
            sound-comparison

  build-and-test:
    name: Build and test PSX (${{ matrix.version }})
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - version: us
            dependency: us
            splat_config: SLUS_005.61.splat.yaml
          - version: jp
            dependency: jp
            splat_config: SLPS_009.02.splat.yaml
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request_target' && 'private-ci' || 'ci' }}
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - name: Install requirements
        run: sudo apt-get install gcc-mipsel-linux-gnu bchunk ninja-build clang-format-15
      - name: Install python requirements
        run: pip3 install splat64==0.24.6 spimdisasm==1.26.0 rabbitizer==1.11.0 n64img==0.3.3 pygfxd crunch64 tabulate
      - name: Clone main repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      # - name: Build psximager
      #   run: |
      #     sudo apt-get install libcdio-dev libvcdinfo-dev libboost-all-dev
      #     cd tools/psximager
      #     ./bootstrap
      #     ./configure
      #     make
      - name: Lint
        run: sh format.sh && git diff --exit-code
      - name: Get dependencies
        uses: actions/checkout@v7
        with:
          repository: sozud/mmx4-deps
          ref: main
          token: ${{ secrets.MMX4_DEPS_TOKEN }}
          path: 'disks/dependencies'
          persist-credentials: false
      - name: Setting up dependencies
        working-directory: disks
        run: cat dependencies/mmx4.${{ matrix.dependency }}.tar.gz.part_* | tar -zxf -
      - name: Extract dependencies
        run: sh extract.sh
      - name: Get Compiler
        run: sh compiler.sh
      - name: Split game data
        run: splat split ./config/${{ matrix.splat_config }}
      - name: Build binaries
        run: sh build.sh
      # - name: Build CD Image
      #   run : |
      #     sh cd_rip.sh
      #     sh cd_build.sh
      - name: Generate progress report
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: sh progress_report.sh
      - name: Upload progress report
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.version }}_report
          path: build/${{ matrix.version }}/report.json
      - name: Get dependencies
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          repository: sozud/mmx4-info
          ref: main
          token: ${{ secrets.MMX4_INFO_TOKEN }}
          path: 'info'
      - name: Generate functions list
        if: matrix.version == 'us' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 ./tools/funcs_todo.py > info/functions.md
      - name: Generate duplicates report
        if: matrix.version == 'us' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
            cd tools/dups
            cargo run --release -- --threshold .90 --output-file ../../info/duplicates.txt
      - name: Commit all reports
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
            git config --global user.name 'GitHub Action'
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Update reports' || true
            git push
        working-directory: info
